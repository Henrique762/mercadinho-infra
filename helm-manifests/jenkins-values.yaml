controller:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  componentName: "jenkins-controller"
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.541.2-jdk21"
  podSecurityContextOverride:
    runAsNonRoot: false
  customInitContainers:
    - name: fix-permissions
      image: "alpine:3"
      command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
  persistence:
    enabled: true
    size: "8Gi"
    storageClass: "standard"
  installPlugins: false
persistence:
  enabled: true
  size: 8Gi
