expose:
  type: clusterIP
  clusterIP:
    name: harbor-expose
    ports:
      httpPort: 80
  tls:
    enabled: false

externalURL: https://harbor.henrique.local

# Otimizações para Homelab
harborAdminPassword: "Harbor12345" # Troque após o primeiro acesso
persistence:
  enabled: true # Em Homelab (Minikube/Docker), a persistência de hostpath causa erros de permissão insolúveis via YAML

# Desabilitando o que não é essencial para economizar recursos
notary:
  enabled: false
chartmuseum:
  enabled: false

# Limites de Recursos para Homelab (Poupando CPU e RAM)
portal:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
core:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
jobservice:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
registry:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m
trivy:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
database:
  type: internal
  internal:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
redis:
  type: internal
  internal:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
