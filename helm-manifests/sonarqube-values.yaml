monitoringPasscode: "define_it"

community:
  enabled: true

jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://postgres.flask-api:5432/sonar"
  jdbcUsername: "postgres"
  jdbcPassword: "admin"

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 800m
    memory: 1.5Gi

sonarProperties:
  sonar.web.javaOpts: "-Xmx384m -Xms384m -XX:+UseSerialGC"
  sonar.search.javaOpts: "-Xmx256m -Xms256m -XX:MaxDirectMemorySize=64m"
  sonar.ce.javaOpts: "-Xmx256m -Xms256m -XX:+UseSerialGC"

nodeSelector:
  kubernetes.io/hostname: "minikube-m02"

startupProbe:
  failureThreshold: 60
