monitoringPasscode: "define_it"

community:
  enabled: true

jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://postgres.flask-api:5432/sonar"
  jdbcUsername: "postgres"
  jdbcPassword: "admin"

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

sonarProperties:
  sonar.web.javaOpts: "-Xmx512m -Xms256m -XX:+UseSerialGC"
  sonar.search.javaOpts: "-Xmx256m -Xms256m -XX:MaxDirectMemorySize=64m"
  sonar.ce.javaOpts: "-Xmx256m -Xms128m -XX:+UseSerialGC"

startupProbe:
  failureThreshold: 60
  timeoutSeconds: 5

readinessProbe:
  timeoutSeconds: 5

livenessProbe:
  timeoutSeconds: 5

