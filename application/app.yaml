apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mercado-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Henrique762/mercadinho.git
    path: manifests
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: flask-api
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true