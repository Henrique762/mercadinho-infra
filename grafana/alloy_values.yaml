COMPUTED VALUES:
alloy:
  clustering:
    enabled: false
    name: ""
    portName: http
  configMap:
    content: |
      // --- LOGS (LOKI) ---
      // Coleta os logs de todos os pods descobertos no cluster
      loki.source.kubernetes "all_pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.local_loki.receiver]
      }

      // Envia os logs para o gateway do Loki
      loki.write "local_loki" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      // --- MÉTRICAS (MIMIR) ---

      // Coleta métricas de performance (CPU, RAM) dos pods do cluster
      prometheus.scrape "kubernetes_pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [prometheus.remote_write.local_mimir.receiver]
      }

      // Coleta métricas dos nós (infraestrutura do Minikube)
      prometheus.exporter.unix "node" { }

      prometheus.scrape "node_metrics" {
        targets    = prometheus.exporter.unix.node.targets
        forward_to = [prometheus.remote_write.local_mimir.receiver]
      }

      // Envia todas as métricas para o Mimir (substituindo seu antigo Prometheus)
      prometheus.remote_write "local_mimir" {
        endpoint {
          url = "http://mimir-distributed-query-frontend.monitoring.svc.cluster.local:8080/api/v1/push"
        }
      }

      // --- TRACES E TELEMETRIA OTLP (TEMPO) ---

      // Recebe Traces e métricas avançadas via protocolo OTLP (da sua app Flask)
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }

        output {
          traces  = [otelcol.exporter.otlp.local_tempo.input]
          metrics = [otelcol.exporter.prometheus.to_mimir.input]
          logs    = [otelcol.exporter.loki.to_loki.input]
        }
      }

      // Converte e envia métricas OTLP para o Mimir
      otelcol.exporter.prometheus "to_mimir" {
        forward_to = [prometheus.remote_write.local_mimir.receiver]
      }

      // Converte e envia logs OTLP para o Loki
      otelcol.exporter.loki "to_loki" {
        forward_to = [loki.write.local_loki.receiver]
      }

      // Envia Traces para o Tempo
      otelcol.exporter.otlp "local_tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }
    create: true
    key: null
    name: null
