loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /tmp/loki
  storage:
    type: s3
    s3:
      endpoint: loki-minio.monitoring.svc.cluster.local:9000
      bucketnames: chunks,ruler,admin
      access_key_id: minioadmin
      secret_access_key: minioadmin
      s3forcepathstyle: true
      insecure: true
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    # Reduz o tempo de descoberta de novas labels
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  # Força o Loki a processar chunks mais rápido
  ingester:
    chunk_idle_period: 1m
    chunk_target_size: 1048576
    max_chunk_age: 1m

minio:
  enabled: true
  accessKey: minioadmin
  secretKey: minioadmin
  buckets:
    - name: chunks
    - name: ruler
    - name: admin

deploymentMode: SingleBinary
singleBinary:
  replicas: 1

# Garante que os outros modos de deploy estao zerados
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
