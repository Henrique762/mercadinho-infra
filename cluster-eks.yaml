apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: h-cluster
  region: us-east-1
  version: "1.34"
  tags:
    Project: H-CLUSTER
    Environment: Dev

vpc:
  id: vpc-0f12943da61999716
  subnets:
    public:
      us-east-1a: {id: subnet-0a7eb74209faef441}
      us-east-1b: {id: subnet-072cc3b98357769d3}

iam:
  withOIDC: true


managedNodeGroups:
  - name: worker-nodes-h
    instanceType: t3.medium
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    volumeSize: 20
    subnets: 
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
        awsLoadBalancerController: true
        albIngress: true
        cloudWatch: true

addons:
  - name: vpc-cni
    version: latest

  - name: coredns
    version: latest

  - name: kube-proxy
    version: latest