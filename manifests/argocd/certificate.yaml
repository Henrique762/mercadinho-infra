apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-henrique-local
  namespace: gateway-system
spec:
  secretName: wildcard-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: "*.henrique.local"
  dnsNames:
  - "henrique.local"
  - "*.henrique.local"