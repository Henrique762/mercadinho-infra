apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-api-ingress
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  tls:
  - hosts:
    - api.henrique.local
    secretName: argocd-tls
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: flask-api-service
            port:
              number: 80