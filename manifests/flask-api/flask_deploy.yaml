# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: flask-api-deployment
#   namespace: flask-api
#   labels:
#     app: flask-api
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-api-flask
  namespace: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: mercadinho-flask-api:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:admin@postgres:5432/postgres"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "flask-app-homelab"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4317"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
  strategy:
    canary:
      # steps:
      #   - setWeight: 50
      #   - pause: {}
      #   - setWeight: 75
      #   - pause: {}
      #   - setWeight: 100
      maxSurge: "25%"
      maxUnavailable: 0