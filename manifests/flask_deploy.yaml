apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-deployment
  namespace: flask-api
  labels:
    app: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: 725510651649.dkr.ecr.us-east-1.amazonaws.com/flask-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:aVeVYknHyitc71NdkSFe@database-h.caisrwnnknl6.us-east-1.rds.amazonaws.com:5432/postgres"